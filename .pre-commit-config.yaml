repos:
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        files: \.sh$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
        files: \.sh$
      - id: check-shebang-scripts-are-executable
        files: \.sh$

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: ["--fix"]

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.0
    hooks:
      - id: cspell
        name: cspell (project spell-check)
        args: ["--no-progress", "--no-summary", "--no-must-find-files"]
        # Scope the check to human-readable sources; avoid binary / generated
        # artefacts such as the compiled SQLite DB.
        files: \.(md|sh|py|ipynb|txt|json|ya?ml|toml)$
        exclude: |
          (?x)^(
              \.venv/.*|
              .*/__pycache__/.*|
              datastore/data/.*|
              datastore/input/.*|
              output/.*|
              notebook/.*\.ipynb$
          )$


  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: \.ipynb$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^datastore/
      - id: ruff-format
        files: ^datastore/

  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-pyupgrade
        args: ["--py310-plus"]
        files: ^notebook/.*\.ipynb$
      - id: nbqa-isort
        files: ^notebook/.*\.ipynb$
      - id: nbqa-black
        files: ^notebook/.*\.ipynb$
      - id: nbqa-ruff
        args: ["--fix", "--extend-ignore=E402"]
        files: ^notebook/.*\.ipynb$
      - id: nbqa-pylint
        args:
          - "--disable=C0103,C0114,C0115,C0116,C0121,C0301,C0413,W0104,W0106,W0621,W0703,W1514,E0401,R0801,R0914,R1714"
          - "--additional-builtins=display,get_ipython"
        additional_dependencies: ["pylint"]
        files: ^notebook/.*\.ipynb$
