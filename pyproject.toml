[tool.ruff]
line-length = 120
# IPython adds these to every notebook's global scope; tell ruff so F821 doesn't
# flag them in Jupyter notebooks (checked by nbqa-ruff).
builtins = ["display", "get_ipython"]

[tool.ruff.lint]
# Disable line-length enforcement and docstring rules across the repo.
ignore = [
    "E501",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]

[tool.pylint.main]
ignore-paths = [
    "^.*/\\.venv/.*$",
    "^\\.venv/.*$",
]

[tool.pylint."messages control"]
# line-too-long — disabled repo-wide.
# broad-except — intentional in bootstrap/reset code paths.
# unspecified-encoding — CSV files are ASCII/UTF-8; not enforced.
# import-error — Pylint runs without venv; imports are exercised at runtime.
# not-callable — false positives on SQLAlchemy ``func.*`` accessors.
# invalid-name — notebooks use short/snake_case locals at module level (the
#   implicit ``__main__`` scope of a notebook); pylint otherwise requires
#   UPPER_CASE for any top-level assignment.
disable = [
    "line-too-long",
    "broad-except",
    "unspecified-encoding",
    "import-error",
    "not-callable",
    "invalid-name",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]

[tool.pydocstyle]
# Disable docstring enforcement repo-wide.
add_ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"
]

[tool.mypy]
ignore_missing_imports = true

[tool.isort]
# Keep isort compatible with black (used together via nbqa on notebooks).
profile = "black"
line_length = 120

[tool.pycodestyle]
max-line-length = 999

[tool.flake8]
max-line-length = 999
extend-ignore = ["E501"]
