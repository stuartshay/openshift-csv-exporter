[tool.ruff]
line-length = 120
# IPython adds these to every notebook's global scope; tell ruff so F821 doesn't
# flag them in Jupyter notebooks (checked by nbqa-ruff).
builtins = ["display", "get_ipython"]

[tool.ruff.lint]
# Disable line-length enforcement and docstring rules across the repo.
ignore = [
    "E501",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]

[tool.pylint.main]
ignore-paths = [
    "^.*/\\.venv/.*$",
    "^\\.venv/.*$",
]

[tool.pylint."messages control"]
# line-too-long (C0301) — disabled repo-wide.
# broad-except (W0703) — intentional in bootstrap/reset code paths.
# unspecified-encoding (W1514) — CSV files are ASCII/UTF-8; not enforced.
# import-error (E0401) — Pylint runs without venv; imports are exercised at runtime.
disable = [
    "C0301",
    "W0703",
    "W1514",
    "E0401",
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
]

[tool.pydocstyle]
# Disable docstring enforcement repo-wide.
add_ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"
]

[tool.mypy]
ignore_missing_imports = true

[tool.isort]
# Keep isort compatible with black (used together via nbqa on notebooks).
profile = "black"
line_length = 120

[tool.pycodestyle]
max-line-length = 999

[tool.flake8]
max-line-length = 999
extend-ignore = ["E501"]
